<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ALLERSAFE RECIPES</title>
    <style>
        body {
            font-family: Arial, sans-serif; /* Apply Arial globally */
            background: #f8f8f8;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        form {
            background: #fbf1cb;
            max-width: 500px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #444;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            box-sizing: border-box;
            font-family: Arial, sans-serif; /* Consistent font */
        }

        textarea {
            resize: vertical;
        }

        button {
            background: #b23a2e;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            font-family: Arial, sans-serif;
        }

        button:hover {
            background: #4e100a;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #496d46;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    
    <h1>ADD RECIPE</h1>
    <form method="POST" action="{{ url_for('add_recipe') }}" enctype="multipart/form-data">
        <label>RECIPE:</label>
        <input type="text" name="name" required>

        <label>PHOTO:</label>
        <input type="file" name="photo" accept="image/*">

        <label>ALLERGEN (comma separated):</label>
        <input type="text" name="allergens" placeholder="eg. gluten, nut">

        <label>RATING (0-5):</label>
        <input type="number" step="0.1" name="rating" min="0" max="5">

        <label>INGREDIENTS (one per line):</label>
        <textarea name="ingredients" rows="6" placeholder="eg.
            Quinoa - 1 cup
            Bell pepper - 2, sliced
            Zucchini - 1, diced
            Cherry Tomatoes - 1 cup
            Olive Oil - 2 tbsp"></textarea>

        <label>INSTRUCTION:</label>
        <textarea name="instruction" rows="6"></textarea>

        <button type="submit">Add Recipe</button>
    </form>
    <a href="{{ url_for('user_main') }}">⬅ Back to Home</a>

</body>
</html>
