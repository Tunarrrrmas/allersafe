<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f0e8 0%, #ede4d3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 50px 40px;
            width: 400px;
            max-width: 90%;
            position: relative;
        }

        .page-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #8B5A3C;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-container {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 2px solid #e0e0e0;
            padding: 12px 20px;
            transition: all 0.3s ease;
        }

        .input-container:focus-within {
            border-color: #D2691E;
            box-shadow: 0 0 10px rgba(210, 105, 30, 0.2);
        }

        .input-icon {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            color:#8B5A3C;
            flex-shrink: 0;
        }

        .form-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 1rem;
            color: #333;
        }

        .form-input::placeholder {
            color: #999;
            font-size: 0.95rem;
        }

        .password-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            margin-left: 10px;
            color: #8B5A3C;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
            transition: color 0.3s ease;
        }

        .password-toggle:hover svg {
            color: #D2691E;
        }

        .login-btn {
            background: linear-gradient(135deg, #D2691E, #FF8C42);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(210, 105, 30, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(210, 105, 30, 0.4);
        }

        .exit-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            text-decoration: none;
            color: #A0522d;
            font-weight: bold;
        }

        .exit-btn:hover {
            color: #d2691e;
        }

        .forgot-pass {
            color: #8B5A3C;
            text-decoration: none;
            text-align: center;
            display: block;
            margin-top: 20px;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .forgot-pass:hover {
            color: #D2691E;
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 40px 30px;
            }

            .page-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="page-title">Log In</h2>
        <a href="{{ url_for('main') }}" class="exit-btn" title="Close">
        ✕
        </a>

        <!-- hantar terus ke Flask -->
        <form method="POST" action="/AllerSafe/login">
            <div class="form-group">
                <div class="input-container">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <input type="text" class="form-input" name="username" placeholder="Username" required>
                </div>
            </div>

            <div class="form-group">
                <div class="input-container">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10C4,8.89 4.9,8 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z"/>
                    </svg>
                    <!-- ✅ enforce min 8 karakter -->
                    <input type="password" class="form-input" id="password-input" name="password" placeholder="Password" required minlength="8">
                    <button type="button" class="password-toggle" id="password-toggle">
                        <!-- Eye open icon -->
                        <svg viewBox="0 0 24 24" fill="currentColor" id="eye-open">
                            <path d="M12,9A3,3 0 0,1 15,12A3,3 0 0,1 12,15A3,3 0 0,1 9,12A3,3 0 0,1 12,9M12,4.5C17,4.5 21.27,7.61 23,12C21.27,16.39 17,19.5 12,19.5C7,19.5 2.73,16.39 1,12C2.73,7.61 7,4.5 12,4.5M3.18,12C4.83,15.36 8.24,17.5 12,17.5C15.76,17.5 19.17,15.36 20.82,12C19.17,8.64 15.76,6.5 12,6.5C8.24,6.5 4.83,8.64 3.18,12Z"/>
                        </svg>
                        <!-- Eye closed icon (hidden by default) -->
                        <svg viewBox="0 0 24 24" fill="currentColor" id="eye-closed" style="display: none;">
                            <path d="M11.83,9L15,12.16C15,12.11 15,12.05 15,12A3,3 0 0,0 12,9C11.94,9 11.89,9 11.83,9M7.53,9.8L9.08,11.35C9.03,11.56 9,11.77 9,12A3,3 0 0,0 12,15C12.22,15 12.44,14.97 12.65,14.92L14.2,16.47C13.53,16.8 12.79,17 12,17A5,5 0 0,1 7,12C7,11.21 7.2,10.47 7.53,9.8M2,4.27L4.28,6.55L4.73,7C3.08,8.3 1.78,10 1,12C2.73,16.39 7,19.5 12,19.5C13.55,19.5 15.03,19.2 16.38,18.66L16.81,19.08L19.73,22L21,20.73L3.27,3M12,7A5,5 0 0,1 17,12C17,12.64 16.87,13.26 16.64,13.82L19.57,16.75C21.07,15.5 22.27,13.86 23,12C21.27,7.61 17,4.5 12,4.5C10.6,4.5 9.26,4.75 8,5.2L10.17,7.35C10.74,7.13 11.35,7 12,7Z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">Log In</button>

            <a href="/AllerSafe/forgot_password" class="forgot-pass">Forget Password</a>
        </form>
    </div>

    <!-- FLASH ALERT UNTUK LOGIN SALAH -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <script>
          {% for message in messages %}
            alert("{{ message|tojson }}");
          {% endfor %}
        </script>
      {% endif %}
    {% endwith %}

    <script>
        // Password toggle functionality
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('password-input');
            const passwordToggle = document.getElementById('password-toggle');
            const eyeOpen = document.getElementById('eye-open');
            const eyeClosed = document.getElementById('eye-closed');

            passwordToggle.addEventListener('click', function() {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    eyeOpen.style.display = 'none';
                    eyeClosed.style.display = 'block';
                } else {
                    passwordInput.type = 'password';
                    eyeOpen.style.display = 'block';
                    eyeClosed.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
