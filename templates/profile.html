<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fffaf3;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
            color: #c96f4a;
        }
        .user-card {
            background: #fff;
            padding: 25px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            text-align: center;
        }
        .user-info p {
            margin: 10px 0;
            color: #333;
            font-size: 1rem;
        }
        .back-btn {
            background: #6c757d;
            color: white;
            margin-bottom: 20px;
            display: inline-block;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
        }
        .back-btn:hover {
            background: #D2691E;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Back to Home Button -->
        <a href="{{ url_for('user_main') }}" class="back-btn">← Back to Home</a>
        
        <h1>My Profile</h1>

        <div class="user-card">
            <div class="user-info">
                <p><strong>Username:</strong> {{ user['username'] }}</p>
                <p><strong>Email:</strong> {{ user['email'] }}</p>
            </div>
        </div>
    </div>
</body>
</html>
